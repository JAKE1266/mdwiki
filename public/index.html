<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mdwiki</title>
  <style>
    :root{
      --bg:#0a0b0f; --bg2:#12141a; --card:#151821; --card2:#1b1f2a;
      --line:#252a36; --line2:#323847;
      --fg:#e8eaf0; --dim:#8b93a7; --dimmer:#5d6478;
      --accent:#6366f1; --ok:#22c55e; --err:#ef4444;
      --r:14px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--fg);font:14px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
    header{position:sticky;top:0;z-index:50;background:rgba(10,11,15,.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:0 24px;height:60px;display:flex;align-items:center;gap:14px}
    .logo{font-size:16px;font-weight:700}
    form.search{flex:1;max-width:520px;display:flex;gap:8px}
    input{flex:1;background:var(--bg2);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:9px 14px;font:inherit}
    input:focus{outline:none;border-color:var(--accent)}
    button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:9px;padding:9px 16px;background:var(--card2);color:var(--fg);border:1px solid var(--line2)}
    button.pri{background:linear-gradient(135deg,var(--accent),#8b5cf6);border:0;color:#fff}
    .layout{max-width:1200px;margin:0 auto;padding:24px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px}
    @media(max-width:800px){.layout{grid-template-columns:1fr}}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
    .card-h{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dimmer);margin-bottom:10px}
    .pages a{display:block;padding:7px 10px;border-radius:8px;color:var(--dim);text-decoration:none;font-size:13px;word-break:break-all}
    .pages a:hover{background:var(--card2);color:var(--fg)}
    .pages a.on{background:rgba(99,102,241,.15);color:#a5b4fc}
    .page{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px 32px;line-height:1.75}
    .page h1,.page h2,.page h3{margin:.6em 0 .4em;line-height:1.3}
    .page h1{font-size:26px;border-bottom:1px solid var(--line);padding-bottom:.3em}
    .page h2{font-size:21px}
    .page code{background:var(--card2);padding:1px 6px;border-radius:5px;font-size:.9em;font-family:ui-monospace,monospace}
    .page pre{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:12px 14px;overflow-x:auto;margin:.7em 0}
    .page pre code{background:none;padding:0}
    .page blockquote{border-left:3px solid var(--accent);background:var(--bg2);padding:8px 14px;margin:.6em 0;border-radius:0 8px 8px 0;color:var(--dim)}
    .page ul,.page ol{padding-left:1.5em;margin:.5em 0}
    .page a{color:#a5b4fc}
    .page a.wl{border-bottom:1px dashed var(--accent);text-decoration:none}
    .page a.wl.missing{color:var(--err);border-bottom-style:dotted;border-color:var(--err)}
    .page img{max-width:100%;border-radius:8px}
    .page hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
    .backlinks{margin-top:26px;border-top:1px dashed var(--line);padding-top:14px}
    .backlinks .t{font-size:12px;font-weight:700;color:var(--dimmer);margin-bottom:8px}
    .backlinks a{display:inline-block;margin:0 8px 8px 0;padding:4px 10px;border-radius:8px;background:var(--card2);color:var(--dim);font-size:12px;text-decoration:none}
    .backlinks a:hover{color:var(--fg);border-color:var(--dimmer)}
    .results .r{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;cursor:pointer}
    .results .r:hover{border-color:var(--accent)}
    .results .r .t{font-weight:700;font-size:14px;margin-bottom:4px}
    .results .r .l{font:12px/1.6 ui-monospace,monospace;color:var(--dim);word-break:break-all}
    .results .r .l mark{background:rgba(99,102,241,.35);color:var(--fg);border-radius:3px;padding:0 2px}
    .results .n{font-size:11px;color:var(--dimmer)}
    .empty{color:var(--dimmer);padding:30px;text-align:center}
    .missing-tip{color:var(--err);font-size:12px;margin-top:10px}
  </style>
</head>
<body>
  <header>
    <div class="logo">📚 mdwiki</div>
    <form class="search" id="searchForm">
      <input id="q" placeholder="全文搜索…(回车)">
      <button type="submit" class="pri">搜索</button>
    </form>
  </header>

  <div class="layout">
    <div>
      <div class="card">
        <div class="card-h">页面</div>
        <div class="pages" id="pageList"></div>
      </div>
      <div class="card" style="margin-top:14px">
        <div class="card-h">说明</div>
        <div class="kv" style="font-size:12px;color:var(--dimmer);line-height:1.7">
          页面 = wiki 目录下的 <b>.md</b> 文件。<br>
          <b>[[页面名]]</b> 建立链接,虚线红色表示页面尚不存在。<br>
          每页底部显示<b>反向链接</b>。
        </div>
      </div>
    </div>

    <div>
      <div id="viewPage" class="page" style="display:none"></div>
      <div id="viewSearch" class="card results" style="display:none">
        <div class="card-h" id="searchHead"></div>
        <div id="searchResults"></div>
      </div>
      <div id="viewEmpty" class="card empty">← 从左侧选择页面,或搜索内容</div>
    </div>
  </div>

  <script>
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
    let pages = []
    let currentPage = null

    async function loadPages() {
      const d = await (await fetch('/api/pages')).json()
      pages = d.pages
      const el = document.getElementById('pageList')
      el.innerHTML = pages.map((p) => `<a href="#/page/${encodeURIComponent(p.path)}" class="${currentPage === p.path ? 'on' : ''}">${esc(p.path)}</a>`).join('') || '<div class="empty">wiki 目录是空的</div>'
    }

    async function showPage(path) {
      const d = await (await fetch(`/api/page/${encodeURIComponent(path)}`)).json()
      document.getElementById('viewSearch').style.display = 'none'
      const el = document.getElementById('viewPage')
      el.style.display = 'block'
      if (!d.ok) {
        el.innerHTML = `<div class="empty">页面不存在:${esc(path)}<br><span class="missing-tip">在 wiki 目录里新建这个 .md 文件即可</span></div>`
        currentPage = null
        loadPages()
        return
      }
      currentPage = d.path
      el.innerHTML = d.html + `
        <div class="backlinks">
          <div class="t">↩ 反向链接(${d.backlinks.length})</div>
          ${d.backlinks.length ? d.backlinks.map((b) => `<a href="#/page/${encodeURIComponent(b.source)}">${esc(b.source)}${b.text && b.text !== b.source ? ' · ' + esc(b.text) : ''}</a>`).join('') : '<span class="kv" style="color:var(--dimmer)">还没有页面链接到这里</span>'}
        </div>`
      loadPages()
    }

    function highlight(line, q) {
      const idx = line.toLowerCase().indexOf(q.toLowerCase())
      if (idx < 0) return esc(line)
      return esc(line.slice(0, idx)) + '<mark>' + esc(line.slice(idx, idx + q.length)) + '</mark>' + esc(line.slice(idx + q.length))
    }

    async function showSearch(q) {
      const d = await (await fetch(`/api/search?q=${encodeURIComponent(q)}`)).json()
      document.getElementById('viewPage').style.display = 'none'
      const box = document.getElementById('viewSearch')
      box.style.display = 'block'
      document.getElementById('searchHead').textContent = `搜索「${q}」 · ${d.results.length} 个页面`
      document.getElementById('searchResults').innerHTML = d.results.length ? d.results.map((r) => `
        <div class="r" data-path="${esc(r.path)}">
          <div class="t">${esc(r.title)} <span class="n">· ${r.count} 处命中</span></div>
          ${r.hits.map((h) => `<div class="l"><span style="color:var(--dimmer)">L${h.line}</span> ${highlight(h.text, q)}</div>`).join('')}
        </div>`).join('') : '<div class="empty">没有匹配内容</div>'
      currentPage = null
      loadPages()
      for (const node of box.querySelectorAll('[data-path]')) {
        node.addEventListener('click', () => { location.hash = `#/page/${encodeURIComponent(node.dataset.path)}` })
      }
    }

    function route() {
      const h = location.hash
      const page = h.match(/^#\/page\/(.+)$/)
      const search = h.match(/^#\/search\/(.+)$/)
      if (page) showPage(decodeURIComponent(page[1]))
      else if (search) showSearch(decodeURIComponent(search[1]))
      else {
        document.getElementById('viewPage').style.display = 'none'
        document.getElementById('viewSearch').style.display = 'none'
        document.getElementById('viewEmpty').style.display = 'block'
        currentPage = null
        loadPages()
      }
    }

    document.getElementById('searchForm').addEventListener('submit', (ev) => {
      ev.preventDefault()
      const q = document.getElementById('q').value.trim()
      if (q) location.hash = `#/search/${encodeURIComponent(q)}`
    })
    window.addEventListener('hashchange', route)
    route()
  </script>
</body>
</html>
